bundle:
  name: ow_tp_p3_analytics

# Pipeline 3 (product analytics). Deployed by the migration service principal only.
# Same shape as pipeline 2's bundle (docs/migration/Pipeline2_schedule_model.md): no prod
# target, every schedule PAUSED, serverless only, no cluster definitions anywhere.

variables:
  landing_path:
    description: Governed landing volume for the analytics event snapshots.
    default: /Volumes/ow_tp/bronze/landing/analytics
  pg_host:
    description: Serving Postgres host that analytics_daily_summary lives on. Not a secret; the password is one.
    default: analytics-db.otterworks.internal
  pg_database:
    default: otterworks_analytics
  pg_user:
    default: analytics_etl
  failure_webhooks:
    description: >-
      on_failure destinations. Empty in the migration target on purpose: a migration session
      does not wire a live pager. Cutover sets it to [{id: <notification destination id>}].
    type: complex
    default: []

targets:
  migration:
    default: true
    mode: development
    workspace:
      host: https://dbc-8bc9474f-40ae.cloud.databricks.com
    presets:
      trigger_pause_status: PAUSED

resources:
  jobs:
    ow_tp_p3_analytics_daily:
      name: ow_tp_p3_analytics_daily
      # Legacy: 0 2 * * * on the ETL box, colliding with finance_excel_report.pl at 02:10.
      # Nothing is shared between them now, so the collision is gone rather than rescheduled.
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      # The legacy has no mutual exclusion at all and its input was destructive, so two runs
      # could eat each other's events. Landing is idempotent now, but concurrent runs would
      # still race on the same gold partition; one at a time, and a late run queues.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: true
      webhook_notifications:
        on_failure: ${var.failure_webhooks}
      parameters:
        # C-1.2 / P3-D08: the date is an explicit parameter instead of "whatever today is on
        # the ETL box". A scheduled run passes the trigger date; a backfill passes any date.
        - name: run_date
          default: "{{job.trigger.time.iso_date}}"
        # Deliberately the trigger date and not a fixed id. A scheduled run must read the
        # snapshot captured for its own day; defaulting to a reusable batch would let every
        # date re-land and re-count the same events, because the landing task reads an
        # already-captured directory and the silver scope takes every SQS row whatever date
        # it carries. With no directory for the date, landing fails loudly instead. Capturing
        # that per-day snapshot is not part of this unit and is a STOP E item; a recon or
        # backfill run passes --params snapshot_batch=<id> explicitly.
        - name: snapshot_batch
          default: "{{job.trigger.time.iso_date}}"
      tasks:
        - task_key: land_events
          spark_python_task:
            python_file: landing/land_analytics_events.py
            parameters:
              - --snapshot-dir
              - ${var.landing_path}/{{job.parameters.snapshot_batch}}
              - --batch
              - "{{job.parameters.snapshot_batch}}"
              - --skip-upload
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: create_tables
          depends_on:
            - task_key: land_events
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - analytics_daily/10_create_silver_analytics_events.sql
              - analytics_daily/20_create_gold_analytics_daily_summary.sql
              - analytics_daily/30_create_gold_analytics_daily_top_users.sql
              - analytics_daily/40_create_gold_analytics_daily_hourly.sql
              - analytics_daily/50_create_gold_analytics_daily_top_user_actions.sql
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: load_silver
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - analytics_daily/11_load_silver_analytics_events.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # The four gold loads read the same silver partition and write four disjoint tables.
        # They are siblings rather than a chain: none of them reads another's output, and a
        # failed one is retried on its own instead of re-running the other three.
        - task_key: load_gold_summary
          depends_on:
            - task_key: load_silver
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - analytics_daily/21_load_gold_analytics_daily_summary.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: load_gold_top_users
          depends_on:
            - task_key: load_silver
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - analytics_daily/31_load_gold_analytics_daily_top_users.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: load_gold_hourly
          depends_on:
            - task_key: load_silver
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - analytics_daily/41_load_gold_analytics_daily_hourly.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # Not a sibling of the other three: it joins gold.analytics_daily_top_users to pick
        # the users whose breakdown it writes, so it has to run after that table's REPLACE
        # WHERE has committed. Depending on load_silver alone would let it read the previous
        # run's ranking and still report success.
        - task_key: load_gold_top_user_actions
          depends_on:
            - task_key: load_gold_top_users
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - analytics_daily/51_load_gold_analytics_daily_top_user_actions.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # P3-D02: the legacy swallowed a Postgres failure and still wrote its report. This
        # task fails the run instead, and it runs last so a serving outage cannot stop the
        # Delta outputs from being produced — the day is recoverable by a retry alone.
        - task_key: publish_summary
          depends_on:
            - task_key: load_gold_summary
          spark_python_task:
            python_file: serving/publish_analytics_summary.py
            parameters:
              - --run-date
              - "{{job.parameters.run_date}}"
              - --batch
              - "{{job.parameters.snapshot_batch}}"
              - --pg-host
              - ${var.pg_host}
              - --pg-database
              - ${var.pg_database}
              - --pg-user
              - ${var.pg_user}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # P3-Q3: the legacy's four data-lake objects, rebuilt byte for byte from gold. The
        # Delta tables remain this unit's governed output; this is the file interface on
        # top of them, for consumers that read the objects rather than the tables. It
        # depends on all four gold tables because the report embeds the summary, the peak
        # hour and the top five users, and the ordering inside the files comes from silver,
        # which every one of them has already read.
        - task_key: export_report_objects
          depends_on:
            - task_key: load_gold_summary
            - task_key: load_gold_hourly
            - task_key: load_gold_top_users
            - task_key: load_gold_top_user_actions
          spark_python_task:
            python_file: exports/export_analytics_reports.py
            parameters:
              - --run-date
              - "{{job.parameters.run_date}}"
              - --batch
              - "{{job.parameters.snapshot_batch}}"
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # The acceptance gate the plan declared and the first cut of this unit dropped:
        # the exported bytes against the legacy's own bytes for the pinned day, not row
        # parity over the tables. It reads back from the volume, so it checks what was
        # written. A date the frozen legacy objects do not cover reports compared=false
        # rather than passing.
        - task_key: compare_report_objects
          depends_on:
            - task_key: export_report_objects
          spark_python_task:
            python_file: exports/compare_legacy_exports.py
            parameters:
              - --unit
              - p3-analytics-daily
              - --run-date
              - "{{job.parameters.run_date}}"
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            # The serving publish is the only task with a dependency beyond the SDK; the
            # password itself comes from secret scope ow_tp at run time, never from here.
            dependencies:
              - psycopg2-binary==2.9.9

    ow_tp_p3_audit_archive_weekly:
      name: ow_tp_p3_audit_archive_weekly
      # Legacy: 0 3 * * 0 on the ETL box (Sunday 03:00 UTC). Quartz needs the day-of-week
      # name and '?' in the unused day-of-month field; "0 0 3 * * 0" would be Sunday in
      # cron and something else here.
      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: true
      webhook_notifications:
        on_failure: ${var.failure_webhooks}
      parameters:
        # P3-D08. The legacy takes its 90-day cutoff from datetime.now() at the moment the
        # script happens to start, so re-running "last Sunday" archives a different set
        # than last Sunday did. Here the date is the run's input, and a rerun of the same
        # date produces the same archive set.
        - name: run_date
          default: "{{job.trigger.time.iso_date}}"
        # As on ow_tp_p3_analytics_daily: land_audit_events reads an already-captured
        # snapshot directory, so a scheduled run needs one for its own date and fails
        # loudly when there is none. Capturing that snapshot from DynamoDB is not part of
        # this unit -- it is the source-extraction step the pipeline still lacks, and a
        # STOP E item. A recon or backfill run passes --params snapshot_batch=<id>.
        - name: snapshot_batch
          default: "{{job.trigger.time.iso_date}}"
      tasks:
        - task_key: land_audit_events
          spark_python_task:
            python_file: landing/land_audit_events.py
            parameters:
              - --snapshot-dir
              - ${var.landing_path}/{{job.parameters.snapshot_batch}}
              - --batch
              - "{{job.parameters.snapshot_batch}}"
              - --skip-upload
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: create_tables
          depends_on:
            - task_key: land_audit_events
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - audit_archive/10_create_silver_audit_archive.sql
              - audit_archive/20_create_silver_audit_archive_run.sql
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: archive_events
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - audit_archive/11_load_silver_audit_archive.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # The compliance report counts what the archive step committed, so it cannot run
        # beside it: a report built from a half-written archive would understate the run
        # and still read as a clean number.
        - task_key: write_compliance_report
          depends_on:
            - task_key: archive_events
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - audit_archive/21_load_silver_audit_archive_run.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # There is no counterpart to the legacy's cleanup_dynamodb step, which is P3-D04:
        # the source stays read-only. This task states the zero deletions rather than
        # leaving a reader to infer it from a task that is not there.
        - task_key: report_run
          depends_on:
            - task_key: write_compliance_report
          spark_python_task:
            python_file: audit/apply_audit_archive.py
            parameters:
              - --run-date
              - "{{job.parameters.run_date}}"
              - --batch
              - "{{job.parameters.snapshot_batch}}"
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    ow_tp_p3_usage_rollup_daily:
      name: ow_tp_p3_usage_rollup_daily
      # The estate schedules UsageRollupJob.scala from the analytics-service Helm chart at
      # 02:00 UTC, not from the ETL crontab, and writes its report to an emptyDir the pod
      # discards on exit (F-0.6). The schedule is kept as found, PAUSED; whether anything
      # should consume the rollup at all is a STOP E question.
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: true
      webhook_notifications:
        on_failure: ${var.failure_webhooks}
      parameters:
        # As on ow_tp_p3_analytics_daily: landing reads an already-captured snapshot
        # directory for the run's own date and fails loudly when there is none. A recon or
        # backfill run passes --params snapshot_batch=<id>.
        - name: snapshot_batch
          default: "{{job.trigger.time.iso_date}}"
      tasks:
        # P3-D06: no spark_jar_task. The aggregator is a group-by, so the events are landed
        # once and the rollup is SQL on Delta; nothing in the Scala needs the JVM.
        - task_key: land_usage_events
          spark_python_task:
            python_file: landing/land_usage_events.py
            parameters:
              - --snapshot-dir
              - ${var.landing_path}/usage/{{job.parameters.snapshot_batch}}
              - --batch
              - "{{job.parameters.snapshot_batch}}"
              - --skip-upload
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: create_tables
          depends_on:
            - task_key: land_usage_events
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - usage_rollup/10_create_gold_usage_rollup.sql
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: load_gold_usage_rollup
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - usage_rollup/11_load_gold_usage_rollup.sql
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    ow_tp_p3_storage_cleanup_daily:
      name: ow_tp_p3_storage_cleanup_daily
      # Legacy: 30 2 * * * on the ETL box.
      schedule:
        quartz_cron_expression: "0 30 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: true
      webhook_notifications:
        on_failure: ${var.failure_webhooks}
      parameters:
        - name: run_date
          default: "{{job.trigger.time.iso_date}}"
        - name: snapshot_batch
          default: "{{job.trigger.time.iso_date}}"
        # P3-D03. Deletion is a job parameter rather than a code constant so that turning
        # it on is a visible, reviewable change to the job by a human who owns the bucket.
        # It is "false" here and no migration run changes it. Even set to "true" the run
        # fails unless the computed candidate set is exactly equal, on (key, size), to the
        # legacy delete set — the flag authorises the action, it does not prove it is safe.
        - name: enable_deletes
          default: "false"
      tasks:
        - task_key: land_inventory
          spark_python_task:
            python_file: landing/land_storage_inventory.py
            parameters:
              - --snapshot-dir
              - ${var.landing_path}/{{job.parameters.snapshot_batch}}
              - --batch
              - "{{job.parameters.snapshot_batch}}"
              - --skip-upload
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: create_tables
          depends_on:
            - task_key: land_inventory
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - storage_cleanup/10_create_silver_storage_cleanup_candidates.sql
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: compute_candidates
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - storage_cleanup/11_load_silver_storage_cleanup_candidates.sql
              - --param
              - run_date={{job.parameters.run_date}}
              - --param
              - batch={{job.parameters.snapshot_batch}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # Reports the numbers the legacy printed, checks the delete set against the legacy
        # one, and deletes nothing. It is the last task because the candidate set is the
        # product of this job; the report is a view of it.
        - task_key: report_candidates
          depends_on:
            - task_key: compute_candidates
          spark_python_task:
            python_file: cleanup/apply_storage_cleanup.py
            parameters:
              - --run-date
              - "{{job.parameters.run_date}}"
              - --batch
              - "{{job.parameters.snapshot_batch}}"
              - --enable-deletes
              - "{{job.parameters.enable_deletes}}"
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
      environments:
        - environment_key: serverless
          spec:
            client: "3"

    # wave 2: the one dependent unit. Everything it reads is another job's gold output, so
    # it has no landing task of its own.
    ow_tp_p3_user_activity_daily:
      name: ow_tp_p3_user_activity_daily
      # Legacy: 0 5 * * * on the ETL box -- three hours after analytics_daily.py, which is
      # how the legacy "depends on" it. That gap survives only as the trigger time; the
      # ordering is the run_job_task below, so a late or re-run analytics day is read after
      # it finishes rather than three hours after midnight whatever happened.
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: true
      webhook_notifications:
        on_failure: ${var.failure_webhooks}
      parameters:
        - name: run_date
          default: "{{job.trigger.time.iso_date}}"
        - name: snapshot_batch
          default: "{{job.trigger.time.iso_date}}"
      tasks:
        # The dependency on analytics_daily as an edge, not a time offset. It is a
        # run_job_task on the owning job rather than a copy of the analytics tasks here:
        # two jobs driving the same gold partition would collide, and queueing is per job,
        # so it would not save them. Queued behind the owning job, an 05:00 run that
        # overlaps a late 02:00 run waits for it instead of racing it.
        #
        # No retry policy on this task on purpose: Databricks drops task-level retries on a
        # run_job_task, so setting one would read as a guarantee the platform discards. The
        # retries that matter are on ow_tp_p3_analytics_daily's own tasks.
        #
        # It inherits that job's failure semantics, including P3-D02: if the serving publish
        # fails, the upstream run fails and this report is not produced, even though its own
        # Delta inputs are complete. That is the loud-failure posture, chosen over reading a
        # day whose upstream run did not finish.
        - task_key: upstream_analytics_daily
          run_job_task:
            job_id: ${resources.jobs.ow_tp_p3_analytics_daily.id}
            job_parameters:
              run_date: "{{job.parameters.run_date}}"
              snapshot_batch: "{{job.parameters.snapshot_batch}}"

        - task_key: create_tables
          depends_on:
            - task_key: upstream_analytics_daily
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - user_activity/10_create_gold_user_activity_report.sql
              - user_activity/20_create_gold_user_activity_report_days.sql
              - user_activity/30_create_gold_user_activity_user_summary.sql
              - user_activity/40_create_gold_user_activity_user_actions.sql
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # The trends block and the daily_summaries block are two reads of the same 31-day
        # window into two disjoint tables, so they are siblings.
        - task_key: load_report
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - user_activity/11_load_gold_user_activity_report.sql
              - --param
              - run_date={{job.parameters.run_date}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: load_report_days
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - user_activity/21_load_gold_user_activity_report_days.sql
              - --param
              - run_date={{job.parameters.run_date}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        - task_key: load_user_summary
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - user_activity/31_load_gold_user_activity_user_summary.sql
              - --param
              - run_date={{job.parameters.run_date}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # Reads the ranking this run just wrote, so it waits for it: against the previous
        # run's rows it would report a ranking that no longer exists and still succeed.
        - task_key: load_user_actions
          depends_on:
            - task_key: load_user_summary
          spark_python_task:
            python_file: sql/apply_p3_sql.py
            parameters:
              - user_activity/41_load_gold_user_activity_user_actions.sql
              - --param
              - run_date={{job.parameters.run_date}}
          environment_key: serverless
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
      environments:
        - environment_key: serverless
          spec:
            client: "3"
