# OtterWorks Industry Solutions — insurance Commission Pay fixture.
# Oracle Database Free (23ai+) running the OLTP schema (COMMISSION_PAY,
# tables + PL/SQL business logic) and the OLAP schema (COMMISSION_DW, star
# schema + ETL + materialized view) in FREEPDB1, alongside commission-service,
# the application tier that now owns the Commission Pay business rules the
# PL/SQL package used to hold. Standalone and local-only, deliberately outside
# the Helm/EKS deployment path.
services:
  insurance-oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${INSURANCE_ORACLE_PWD:-Workshop123}
    ports:
      - "127.0.0.1:${INSURANCE_DB_PORT:-51521}:1521"
    volumes:
      - ./services/industry-solutions/insurance/db/startup:/opt/oracle/scripts/startup:ro
      - ./services/industry-solutions/insurance/db:/opt/oracle/scripts/insurance:ro
      - insurance-oracle-data:/opt/oracle/oradata
    healthcheck:
      # Healthy only once the FIXTURE_META completion marker (written after
      # every init script succeeded and all objects compiled VALID) exists.
      test: ["CMD-SHELL", "echo \"SELECT 'FIXTURE_READY' FROM fixture_meta;\" | sqlplus -s commission_pay/commission_pay@localhost:1521/FREEPDB1 | grep -q FIXTURE_READY"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s

  commission-service:
    build:
      context: ./services/industry-solutions/insurance/commission-service
    environment:
      COMMISSION_SVC_DSN: insurance-oracle:1521/FREEPDB1
    ports:
      - "127.0.0.1:${INSURANCE_SVC_PORT:-58000}:8000"

volumes:
  insurance-oracle-data:
