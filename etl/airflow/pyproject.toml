[tool.ruff]
line-length = 100
target-version = "py312"
src = ["dags", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["otterworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dags"]
filterwarnings = ["ignore::DeprecationWarning"]
