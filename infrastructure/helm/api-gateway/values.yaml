replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-api-gateway
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

# ClusterIP only. A LoadBalancer Service makes the AWS cloud-controller create
# an ELB that Terraform does not track, which is stranded (and billed) forever
# if the Service or the cluster is deleted while the controller is not running.
# External access goes through the single shared ingress-nginx controller.
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: otterworks-tls
      hosts:
        - otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8080

# Prometheus metrics are served on a dedicated internal listener (METRICS_PORT),
# never on the public 8080 listener unless METRICS_PUBLIC=true.
monitoring:
  enabled: true
  path: /metrics
  port: 9090

env:
  AUTH_SERVICE_URL: "http://auth-service:8081"
  FILE_SERVICE_URL: "http://file-service:8082"
  DOCUMENT_SERVICE_URL: "http://document-service:8083"
  COLLAB_SERVICE_URL: "http://collab-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  SEARCH_SERVICE_URL: "http://search-service:8087"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8088"
  ADMIN_SERVICE_URL: "http://admin-service:8089"
  AUDIT_SERVICE_URL: "http://audit-service:8090"
  METRICS_PORT: "9090"
  METRICS_PUBLIC: "false"
  # Peers whose X-Forwarded-For / X-Real-IP the gateway believes (comma-separated
  # CIDRs). Empty means every client is keyed by its TCP peer address, so behind
  # ingress-nginx all traffic would share the controller's rate-limit bucket. Set
  # this to the ingress-nginx pod CIDR (or the cluster pod CIDR) at deploy time,
  # e.g. --set env.TRUSTED_PROXY_CIDRS="10.0.0.0/8". ingress-nginx sets
  # X-Forwarded-For / X-Real-IP to the connecting client by default; if it is
  # behind an NLB with proxy-protocol, enable use-proxy-protocol there as well.
  TRUSTED_PROXY_CIDRS: ""

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
