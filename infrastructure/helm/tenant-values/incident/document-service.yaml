# Helm values overlay for tenant `incident` (branch demo-incident, namespace
# otterworks-incident), applied by scripts/deploy-tenant.sh.
monitoring:
  enabled: true
  rules:
    enabled: true
  dashboard:
    enabled: true
  links:
    grafana: https://grafana.otterworks.app
    jaeger: https://jaeger.otterworks.app
tracing:
  enabled: true
resources:
  limits:
    memory: 512Mi
