# Delivery for the alerts Prometheus evaluates (alerts.yml and the generated
# slo_rules.yml). Grafana's contact point only receives Grafana-managed alerts,
# so without this every Prometheus alert would fire into nothing.
#
# The receiver is the same admin-service webhook the Grafana contact point
# uses, so both alerting paths land in one inbox.

route:
  receiver: otterworks-webhook
  group_by: [alertname, backend, route]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # A page should not wait out the grouping delay.
    - matchers: ['severity="critical"']
      receiver: otterworks-webhook
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: otterworks-webhook
    webhook_configs:
      - url: http://admin-service:8089/api/v1/admin/alerts/ingest
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/webhook-secret

inhibit_rules:
  # While an endpoint is paging on a fast burn of one SLO, its slower-window
  # warnings about the same SLO are noise about the same incident. Scoped to
  # the endpoint alerts: Alertmanager treats two absent labels as equal, so an
  # unscoped rule would let any legacy critical alert mute every legacy warning.
  - source_matchers: ['alertname=~"CriticalApi.+"', 'severity="critical"']
    target_matchers: ['alertname=~"CriticalApi.+"', 'severity="warning"']
    equal: [backend, method, route, slo]
