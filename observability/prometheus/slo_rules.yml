      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is serving requests slower than its
        latency objective 1x faster than the 30d budget allows, over the last 3d and 6h.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
- name: otterworks.slo.traffic
  rules:
  - alert: CriticalApiNoTraffic
    expr: |
      (slo:api_endpoint:expect_traffic == 1)
      unless on (backend, method, route)
      (slo:api_request:rate5m > 0)
    for: 15m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: critical
      slo: availability
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} has served no traffic for 15m'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) normally serves continuous traffic.
        Zero requests usually means the gateway route, the client, or the whole service is broken rather
        than idle.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
- name: otterworks.slo.probes
  rules:
  - alert: CriticalApiProbeFailing
    expr: |
      probe_success{job="blackbox-critical-api"} == 0
    for: 2m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: critical
      slo: availability
    annotations:
      summary: '{{ $labels.backend }} is failing its health probe'
      description: The synthetic health check {{ $labels.probe_id }} against {{ $labels.instance }} has
        failed for 2 minutes, so {{ $labels.backend }} is down or unreachable. This fires independently
        of user traffic, so it catches outages during quiet hours.
      runbook_url: https://docs.otterworks.dev/runbooks/critical-api-slo
  - alert: CriticalApiProbeSlow
    expr: |
      probe_duration_seconds{job="blackbox-critical-api"} > 2
      and on (instance)
      (probe_success{job="blackbox-critical-api"} == 1)
    for: 10m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: warning
      slo: latency
    annotations:
      summary: '{{ $labels.backend }} health probe is slow'
      description: The synthetic health check {{ $labels.probe_id }} took {{ $value | humanizeDuration
        }}, above the 2s probe budget.
      runbook_url: https://docs.otterworks.dev/runbooks/critical-api-slo
