      affected_service: '{{ $labels.backend }}'
      severity: critical
      slo: latency
      burn_rate: fast
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} is burning its latency budget (fast)'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is serving requests slower than its
        latency objective 14.4x faster than the 30d budget allows, over the last 1h and 5m.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
  - alert: CriticalApiLatencyBudgetBurnMedium
    expr: |
      (
        slo:api_request_latency:bad_ratio_rate6h
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (6 * (1 - slo:api_endpoint:latency_objective))
      )
      and on (backend, method, route)
      (
        slo:api_request_latency:bad_ratio_rate30m
          > on (backend, method, route)
        (6 * (1 - slo:api_endpoint:latency_objective))
      )
    for: 5m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: critical
      slo: latency
      burn_rate: medium
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} is burning its latency budget (medium)'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is serving requests slower than its
        latency objective 6x faster than the 30d budget allows, over the last 6h and 30m.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
  - alert: CriticalApiLatencyBudgetBurnSlow
    expr: |
      (
        slo:api_request_latency:bad_ratio_rate1d
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (3 * (1 - slo:api_endpoint:latency_objective))
      )
      and on (backend, method, route)
      (
        slo:api_request_latency:bad_ratio_rate2h
          > on (backend, method, route)
        (3 * (1 - slo:api_endpoint:latency_objective))
