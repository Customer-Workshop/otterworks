- name: otterworks.slo.budget
  interval: 1m
  rules:
  - record: slo:api_error_budget:remaining_ratio
    expr: |
      1 - (
        slo:api_request_errors:ratio_rate30d
        / on (backend, method, route) group_left ()
        (1 - slo:api_endpoint:availability_objective)
      )
  - record: slo:api_latency_budget:remaining_ratio
    expr: |
      1 - (
        slo:api_request_latency:bad_ratio_rate30d
        / on (backend, method, route) group_left ()
        (1 - slo:api_endpoint:latency_objective)
      )
- name: otterworks.slo.burn_rate
  rules:
  - alert: CriticalApiErrorBudgetBurnFast
    expr: |
      (
        slo:api_request_errors:ratio_rate1h
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (14.4 * (1 - slo:api_endpoint:availability_objective))
      )
      and on (backend, method, route)
      (
        slo:api_request_errors:ratio_rate5m
          > on (backend, method, route)
        (14.4 * (1 - slo:api_endpoint:availability_objective))
      )
    for: 2m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: critical
      slo: availability
      burn_rate: fast
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} is burning its availability error budget (fast)'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is returning 5xx 14.4x faster than
        its 30d availability objective allows, over the last 1h and 5m. At this rate it consumes 2% of
        the 30d budget in 1 hour.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
  - alert: CriticalApiErrorBudgetBurnMedium
    expr: |
      (
        slo:api_request_errors:ratio_rate6h
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (6 * (1 - slo:api_endpoint:availability_objective))
      )
      and on (backend, method, route)
      (
        slo:api_request_errors:ratio_rate30m
          > on (backend, method, route)
        (6 * (1 - slo:api_endpoint:availability_objective))
      )
    for: 2m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: critical
      slo: availability
      burn_rate: medium
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} is burning its availability error budget (medium)'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is returning 5xx 6x faster than its
        30d availability objective allows, over the last 6h and 30m. At this rate it consumes 5% of the
        30d budget in 6 hours.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
  - alert: CriticalApiErrorBudgetBurnSlow
    expr: |
      (
        slo:api_request_errors:ratio_rate1d
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (3 * (1 - slo:api_endpoint:availability_objective))
      )
      and on (backend, method, route)
      (
        slo:api_request_errors:ratio_rate2h
          > on (backend, method, route)
        (3 * (1 - slo:api_endpoint:availability_objective))
      )
    for: 2m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: warning
      slo: availability
      burn_rate: slow
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} is burning its availability error budget (slow)'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is returning 5xx 3x faster than its
        30d availability objective allows, over the last 1d and 2h. At this rate it consumes 10% of the
        30d budget in 1 day.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
  - alert: CriticalApiErrorBudgetBurnVerySlow
    expr: |
      (
        slo:api_request_errors:ratio_rate3d
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (1 * (1 - slo:api_endpoint:availability_objective))
      )
      and on (backend, method, route)
      (
        slo:api_request_errors:ratio_rate6h
          > on (backend, method, route)
        (1 * (1 - slo:api_endpoint:availability_objective))
      )
    for: 2m
    labels:
      affected_service: '{{ $labels.backend }}'
      severity: warning
      slo: availability
      burn_rate: very_slow
    annotations:
      summary: '{{ $labels.method }} {{ $labels.route }} is burning its availability error budget (very_slow)'
      description: '{{ $labels.endpoint_id }} ({{ $labels.owner }}) is returning 5xx 1x faster than its
        30d availability objective allows, over the last 3d and 6h. At this rate it consumes 10% of the
        30d budget in 3 days.'
      runbook_url: https://docs.otterworks.dev/runbooks/{{ $labels.runbook }}
  - alert: CriticalApiLatencyBudgetBurnFast
    expr: |
      (
        slo:api_request_latency:bad_ratio_rate1h
          > on (backend, method, route) group_left (endpoint_id, tier, owner, runbook)
        (14.4 * (1 - slo:api_endpoint:latency_objective))
      )
