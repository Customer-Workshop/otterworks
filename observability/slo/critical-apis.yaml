# Synthetic liveness probes, run on a fixed interval whether or not users are
# sending traffic, so a quiet-hours outage is detected instead of showing up as
# "no data". They carry no SLO of their own but page immediately on failure.
#
# They deliberately probe /health rather than the catalogued endpoints: the
# gateway answers an unauthenticated request to a protected route with 401
# before the proxy reaches the backend, so a credential-free endpoint probe
# would stay green through a total backend outage. Probing each backend's own
# /health needs no credentials and still fails when that backend is down.
health_probes:
  - id: gateway_health
    backend: api-gateway
    url: http://api-gateway:8080/health
    expect_status: [200]
  - id: auth_health
    backend: auth-service
    owner: identity
    url: http://auth-service:8081/health
    expect_status: [200]
  - id: document_health
    backend: document-service
    owner: documents
    url: http://document-service:8083/health
    expect_status: [200]
  - id: file_health
    backend: file-service
    owner: storage
    url: http://file-service:8082/health
    expect_status: [200]
  - id: search_health
    backend: search-service
    owner: discovery
    url: http://search-service:8087/health
    expect_status: [200]
  - id: notification_health
    backend: notification-service
    owner: engagement
    url: http://notification-service:8086/health
    expect_status: [200]
  - id: collab_health
    backend: collab-service
    owner: collaboration
    url: http://collab-service:8084/health
    expect_status: [200]
