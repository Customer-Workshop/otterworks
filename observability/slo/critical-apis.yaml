  - id: documents_update
    service: document-service
    owner: documents
    method: PUT
    route: /api/v1/documents/{id}
    tier: critical
    availability: 0.999
    latency:
      threshold: 1
      objective: 0.99
    expect_traffic: true
    runbook: critical-api-slo

  - id: documents_export
    service: document-service
    owner: documents
    method: GET
    route: /api/v1/documents/{id}/export
    tier: high
    availability: 0.99
    latency:
      threshold: 2.5
      objective: 0.95
    expect_traffic: false
    runbook: critical-api-slo

  - id: files_upload
    service: file-service
    owner: storage
    method: POST
