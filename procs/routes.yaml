modules:
  plans:
    status: extracted
    entrypoints:
      billing.fn_list_plans:
        method: GET
        path: /api/plans
        response:
          business_fields:
            codes: {json_path: "$[*].code", type: text, collect: true}
            fees: {json_path: "$[*].monthly_fee", type: decimal, collect: true}
      billing.fn_entitlement:
        method: GET
        path: /api/tenants/{tenant_id}/entitlement
        inputs:
          path:
            tenant_id: tenant_id
          query:
            "on": as_of
        response:
          business_fields:
            plan_code: {json_path: "$.plan_code", type: text}
            tier: {json_path: "$.tier", type: text}
            included_units: {json_path: "$.included_units", type: integer}
            subscription_status: {json_path: "$.subscription_status", type: text}
      billing.sp_change_plan:
        method: POST
        path: /api/tenants/{tenant_id}/plan-change
        inputs:
          path:
            tenant_id: tenant_id
          body:
            plan_id: plan_id
            effective_on: effective_on
        response:
          business_fields:
            subscriptions:
              json_path: "$.subscriptions"
              type: rows
          probes:
            subscription_rows:
              json_path: "$.subscriptions"
  rating:
    status: pending
    entrypoints: {}
  invoicing:
    status: extracted
    entrypoints:
      billing.fn_invoice_preview:
        method: GET
        path: /api/tenants/{tenant_id}/invoice-preview
        inputs:
          path:
            tenant_id: tenant_id
          query:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            line_numbers: {json_path: "$[*].line_no", type: integer, collect: true}
            line_types: {json_path: "$[*].line_type", type: text, collect: true}
            amounts: {json_path: "$[*].amount", type: decimal, collect: true}
            tax_amount: {json_path: "$[*].tax_amount", type: decimal, collect: true}
            totals: {json_path: "$[*].total", type: decimal, collect: true}
      billing.sp_issue_invoice:
        method: POST
        path: /api/tenants/{tenant_id}/invoice
        inputs:
          path:
            tenant_id: tenant_id
          body:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            credit_ids: {json_path: "$.credit_notes[*].id", type: text, collect: true}
            issued_on: {json_path: "$.credit_notes[*].issued_on", type: date, collect: true}
            remaining: {json_path: "$.credit_notes[*].remaining_amount", type: decimal, collect: true}
            status: {json_path: "$.status", type: text}
            tax: {json_path: "$.tax", type: decimal}
            total: {json_path: "$.total", type: decimal}
          probes:
            invoice_state:
              json_path: "$.invoice_state"
              type: rows
      billing.fn_invoice_lines:
        method: GET
        path: /api/invoices/{invoice_id}/lines
        inputs:
          path:
            invoice_id: invoice_id
        response:
          business_fields:
            line_types: {json_path: "$[*].line_type", type: text, collect: true}
            amounts: {json_path: "$[*].amount", type: decimal, collect: true}
  dunning:
    status: pending
    entrypoints: {}
