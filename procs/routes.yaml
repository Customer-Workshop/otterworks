modules:
  plans:
    status: extracted
    entrypoints:
      billing.fn_list_plans:
        method: GET
        path: /api/plans
        response:
          business_fields:
            codes: {json_path: "$[*].code", type: text, collect: true}
            fees: {json_path: "$[*].monthly_fee", type: decimal, collect: true}
      billing.fn_entitlement:
        method: GET
        path: /api/tenants/{tenant_id}/entitlement
        inputs:
          path:
            tenant_id: tenant_id
          query:
            "on": as_of
        response:
          business_fields:
            plan_code: {json_path: "$.plan_code", type: text}
            tier: {json_path: "$.tier", type: text}
            included_units: {json_path: "$.included_units", type: integer}
            subscription_status: {json_path: "$.subscription_status", type: text}
      billing.sp_change_plan:
        method: POST
        path: /api/tenants/{tenant_id}/plan-change
        inputs:
          path:
            tenant_id: tenant_id
          body:
            plan_id: plan_id
            effective_on: effective_on
        response:
          business_fields:
            subscriptions:
              json_path: "$.subscriptions"
              type: rows
          probes:
            subscription_rows:
              json_path: "$.subscriptions"
  rating:
    status: pending
    entrypoints: {}
  invoicing:
    status: pending
    entrypoints: {}
  dunning:
    status: extracted
    entrypoints:
      billing.fn_overdue_accounts:
        method: GET
        path: /api/dunning/overdue
        inputs:
          query:
            as_of: as_of
        response:
          business_fields:
            tenant_ids: {json_path: "$[*].tenant_id", type: uuid, collect: true}
            days_overdue: {json_path: "$[*].days_overdue", type: integer, collect: true}
      billing.sp_schedule_dunning:
        method: POST
        path: /api/dunning/schedule
        inputs:
          body:
            as_of: as_of
        response:
          business_fields:
            attempt_no: {json_path: "$.latest_attempt.attempt_no", type: integer}
            scheduled_for: {json_path: "$.latest_attempt.scheduled_for", type: text}
            status: {json_path: "$.latest_attempt.status", type: text}
          probes:
            schedule_rows:
              json_path: "$.attempts"
              type: rows
      billing.sp_suspend_overdue:
        method: POST
        path: /api/dunning/suspend
        inputs:
          body:
            as_of: as_of
        response:
          business_fields:
            status: {json_path: "$.suspensions[0].status", type: text}
            suspended_on: {json_path: "$.suspensions[0].suspended_on", type: text}
            notification_kinds: {json_path: "$.notifications[*].kind", type: text, collect: true}
          probes:
            suspension_notifications:
              json_path: "$.notifications"
              type: rows
