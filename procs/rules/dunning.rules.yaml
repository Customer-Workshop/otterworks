module: dunning
rules:
  - id: DUNNING-001
    statement: >-
      Overdue accounts list every invoice in status overdue issued strictly before the
      requested date, ordered by issued_at then invoice id, with days overdue as the
      calendar-day difference between the requested date and the invoice issue date in UTC.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [1, 18]
    inputs: [as_of]
    outputs: [tenant_id, invoice_id, total, days_overdue, tenant_status]
    confidence: high
    scenarios: [DUNNING-001]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-002
    statement: >-
      A dunning attempt is scheduled for the requested date, rolled forward to the following
      Monday when that date falls on a Saturday (+2 days) or a Sunday (+1 day).
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [37, 42]
    inputs: [as_of]
    outputs: [scheduled_for]
    confidence: high
    scenarios: [DUNNING-002, DUNNING-003]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-003
    statement: >-
      Scheduling walks overdue invoices in issued_at then id order and inserts, per invoice,
      one attempt numbered one above that invoice's highest existing attempt, keyed by the
      md5 of the invoice id concatenated with the attempt number, leaving an already existing
      invoice/attempt pair untouched.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [28, 48]
    inputs: [as_of]
    outputs: [invoice_id, attempt_no, scheduled_for, status]
    confidence: high
    scenarios: [DUNNING-002, DUNNING-003]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-004
    statement: >-
      Scheduling reports the attempt it inserted last as its scheduled attempt, and reports
      no attempt at all when every overdue invoice already had that attempt number.
    question: >-
      The legacy procedure returns nothing, so which single attempt do the recorded
      scheduled_for, status and attempt_no observations describe?
    answer: >-
      The attempt inserted last in the procedure's own issued_at, id loop order. The
      transcripts observe the newest attempt of the last overdue invoice processed, so the
      extraction exposes that attempt and exposes null for each of the three fields when the
      run inserted nothing.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [43, 48]
    inputs: [as_of]
    outputs: [attempt_no, scheduled_for, status]
    confidence: medium
    scenarios: [DUNNING-002, DUNNING-003]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-005
    statement: >-
      Suspension applies to tenants holding an overdue invoice issued at least fourteen
      calendar days before the requested date, and only while the tenant is still active; an
      already suspended tenant is skipped and its subscriptions are left untouched.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [59, 71]
    inputs: [as_of]
    outputs: [tenant_status]
    confidence: high
    scenarios: [DUNNING-004]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-006
    statement: >-
      Suspending a tenant suspends each of its active subscriptions and stamps suspended_on
      with the requested date, which comes from request input and never from the clock.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [72, 75]
    inputs: [as_of]
    outputs: [status, suspended_on]
    confidence: high
    scenarios: [DUNNING-004]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-007
    statement: >-
      Each suspended tenant gets one suspension notification, identified by the md5 of the
      tenant id, the literal suspension and the requested date, sent at the requested date at
      midnight UTC, and re-running the same date inserts no duplicate.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [76, 84]
    inputs: [as_of]
    outputs: [id, tenant_id, kind, sent_at]
    confidence: high
    scenarios: [DUNNING-004, DUNNING-005]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
  - id: DUNNING-008
    statement: >-
      Tenants selected for suspension are processed in ascending tenant id order and the
      reported suspension notifications are ordered by tenant id then sent_at.
    question: >-
      The legacy loop reads SELECT DISTINCT tenant_id with no ORDER BY, so what order does
      the extraction use?
    answer: >-
      Ascending tenant id, which is total, deterministic and matches the tenant id then
      sent_at ordering the recorded probe exhibits; the procedure's per-tenant work is
      independent, so the order affects only the reported sequence.
    source:
      file: services/legacy-billing/db/procs/dunning.sql
      lines: [59, 64]
    inputs: [as_of]
    outputs: [tenant_id]
    confidence: medium
    scenarios: [DUNNING-004]
    decision:
      status: approved
      reviewer: product-owner
      date: "2026-08-21"
      note: Approved for the dunning extraction.
