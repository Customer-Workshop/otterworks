# Trivy scanning configuration for OtterWorks
severity:
  - CRITICAL
  - HIGH

scan:
  # report-service is a legacy Java 8 service earmarked for a separate framework
  # upgrade exercise (see docs/labs/security-sprint-guide.md); it is out of scope
  # for the security scan and every suppression in .trivyignore.
  skip-dirs:
    - services/report-service

vulnerability:
  type:
    - os
    - library

ignorefile: .trivyignore

timeout: 10m

format: table
