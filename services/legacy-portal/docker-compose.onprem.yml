# On-prem / VM deployment profile for legacy-portal.
#
# This is the "runs on a VM today" story: a plain Docker Compose stack that a team would run on
# an on-prem host or a single VM. It is deliberately SEPARATE from the repo's Helm/EKS deploy
# path (scripts/deploy-dev.sh).
#
# The app is now the post-decomposition shell: it serves /health and the actuator endpoints and
# owns no data, so the local PostgreSQL that used to back its three schemas is gone. Retiring
# what is left is docs/migration/decommission.md.
#
#   Usage (from services/legacy-portal/):
#     docker compose -f docker-compose.onprem.yml up --build
#     curl http://localhost:8095/health
#     docker compose -f docker-compose.onprem.yml down -v
services:
  legacy-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legacy-portal
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
