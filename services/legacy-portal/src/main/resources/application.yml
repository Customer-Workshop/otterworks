server:
  port: 8095

spring:
  application:
    name: legacy-portal
  # The shell owns no data. The three bounded contexts (announcements, user_preferences,
  # feedback) and their schemas moved to the extracted services, so there is no datasource,
  # no JPA and no database here; see docs/migration/decommission.md.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
