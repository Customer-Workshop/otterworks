# Operator-editable portal branding. Interpolated by Commons Configuration, but only
# key-to-key references (e.g. ${portal.environment}) resolve: prefixed lookups such as
# ${env:...}, ${file:...} and ${sys:...} are disabled because these values are served
# unauthenticated on /health.
#
# This packaged copy is the default source. To edit without a redeploy, start the service
# with -Dportal.settings.path=/absolute/path/to/portal-settings.properties; a file dropped
# into the process working directory is never picked up.
portal.environment=on-prem
portal.support=portal-support@otterworks.example
portal.banner=OtterWorks Portal (${portal.environment}) - contact ${portal.support}
portal.classification=INTERNAL
