openapi: 3.0.3
info:
  title: OtterWorks Webhook Service
  version: 0.1.0
  description: |
    Headless outbound webhook delivery API. Every response is JSON. `target_url` must
    use HTTP or HTTPS and, unless `ALLOW_PRIVATE_TARGETS=true`, must not resolve to
    localhost, loopback, private, link-local, unspecified, or multicast addresses.
    Deliveries use
    POST JSON with X-OtterWorks-Event, X-OtterWorks-Delivery-Id,
    X-OtterWorks-Timestamp (Unix seconds), and X-OtterWorks-Signature
    (sha256=HMAC-SHA256(secret, timestamp + "." + body)).
servers:
  - url: http://localhost:8092
paths:
  /health:
    get:
      responses: {"200": {description: Healthy, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}}
  /api/v1/webhooks/subscriptions:
    post:
      security: [{userHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionRequest"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionCreated"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
    get:
      security: [{userHeader: []}]
      responses:
        "200": {description: Subscriptions, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/webhooks/subscriptions/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      security: [{userHeader: []}]
      responses:
        "200": {description: Subscription, content: {application/json: {schema: {$ref: "#/components/schemas/Subscription"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      security: [{userHeader: []}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/webhooks/subscriptions/{id}/test:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      security: [{userHeader: []}]
      responses:
        "202": {description: Enqueued, content: {application/json: {schema: {$ref: "#/components/schemas/TestResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/webhooks/deliveries:
    get:
      security: [{userHeader: []}]
      parameters:
        - {name: subscription_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 100}}
      responses:
        "200": {description: Deliveries, content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryList"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    userHeader: {type: apiKey, in: header, name: X-User-ID}
  responses:
    BadRequest: {description: Bad request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthorized: {description: Unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotAcceptable: {description: Not acceptable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Error: {type: object, required: [error], properties: {error: {type: string}, accepts: {type: array, items: {type: string}}}}
    Health: {type: object, required: [status, version], properties: {status: {type: string}, version: {type: string}}}
    SubscriptionRequest: {type: object, required: [target_url, event_types], properties: {target_url: {type: string, format: uri, maxLength: 2048}, event_types: {type: array, minItems: 1, items: {type: string, enum: [file.shared, document.updated, comment.added, webhook.ping]}}, description: {type: string, maxLength: 1024}}}
    Subscription: {type: object, required: [id, target_url, event_types, active, created_at], properties: {id: {type: string, format: uuid}, target_url: {type: string}, event_types: {type: array, items: {type: string}}, description: {type: string}, active: {type: boolean}, created_at: {type: string, format: date-time}}}
    SubscriptionCreated: {allOf: [{$ref: "#/components/schemas/Subscription"}, {type: object, required: [secret], properties: {secret: {type: string}}}]}
    SubscriptionList: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Subscription"}}}}
    TestResponse: {type: object, required: [delivery_id, status], properties: {delivery_id: {type: string, format: uuid}, status: {type: string}}}
    DeliveryAttempt: {type: object, properties: {attempt: {type: integer}, response_code: {type: integer, nullable: true}, error: {type: string, nullable: true}, duration_ms: {type: integer}, attempted_at: {type: string, format: date-time}}}
    Delivery: {type: object, properties: {id: {type: string, format: uuid}, subscription_id: {type: string, format: uuid}, event_type: {type: string}, status: {type: string}, attempts: {type: integer}, max_attempts: {type: integer}, last_response_code: {type: integer, nullable: true}, last_error: {type: string, nullable: true}, next_attempt_at: {type: string, format: date-time}, created_at: {type: string, format: date-time}, delivered_at: {type: string, format: date-time, nullable: true}, attempts_log: {type: array, items: {$ref: "#/components/schemas/DeliveryAttempt"}}}}
    DeliveryPayload: {type: object, description: "Outbound body. Headers carry event, delivery ID, Unix timestamp, and HMAC signature.", properties: {id: {type: string}, event: {type: string}, created_at: {type: string, format: date-time}, data: {type: object}}}
    DeliveryList: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Delivery"}}}}
