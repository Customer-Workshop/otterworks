# Strimzi Kafka <token>-kafka: KRaft, one ephemeral combined controller+broker node, sized small.
# Bootstrap: <token>-kafka-kafka-bootstrap.<token>-after.svc:9092 (plain listener). The Topic Operator
# materialises the services' KafkaTopic objects; the Kafka Exporter publishes consumer-group lag.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: ${TOKEN}-broker
  namespace: ${NS_AFTER}
  labels:
    strimzi.io/cluster: ${TOKEN}-kafka
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
spec:
  replicas: 1
  roles: [controller, broker]
  storage: {type: ephemeral, sizeLimit: 2Gi}
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "1", memory: 1536Mi}
  jvmOptions: {-Xms: 512m, -Xmx: 512m}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ${TOKEN}-kafka
  namespace: ${NS_AFTER}
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
spec:
  kafka:
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 6
      auto.create.topics.enable: "false"
      log.retention.hours: 24
      group.initial.rebalance.delay.ms: 0
    template:
      pod:
        metadata:
          annotations: {karpenter.sh/do-not-disrupt: "true"}
          labels: {demo.otterworks.app/run-token: "${TOKEN}", demo.otterworks.app/side: after}
  entityOperator:
    topicOperator:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 500m, memory: 384Mi}
    template:
      pod:
        metadata:
          labels: {demo.otterworks.app/run-token: "${TOKEN}", demo.otterworks.app/side: after}
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    template:
      pod:
        metadata:
          labels: {demo.otterworks.app/run-token: "${TOKEN}", demo.otterworks.app/side: after}
---
# Consumer-group lag for the dashboard (kafka_consumergroup_lag{consumergroup="<token>-payments"}).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${TOKEN}-kafka-exporter
  namespace: ${NS_AFTER}
  labels: {demo.otterworks.app/run-token: "${TOKEN}", demo.otterworks.app/side: after}
spec:
  selector:
    matchLabels: {strimzi.io/kind: KafkaExporter, strimzi.io/cluster: ${TOKEN}-kafka}
  podMetricsEndpoints:
    - port: tcp-prometheus
      interval: 15s
