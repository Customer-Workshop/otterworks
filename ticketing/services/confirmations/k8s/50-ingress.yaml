# Expose GET /api/confirmations/{orderRef} on the after host through the shared ingress-nginx -> Kourier
# (CONVENTIONS.md "Routing request-driven services through the shared ingress"). /events/* and /stats stay
# cluster-local. The integration stage owns the host's TLS secret; this Ingress only adds a path rule.
apiVersion: v1
kind: Service
metadata:
  name: ${TOKEN}-confirmations-kourier
  namespace: ${TOKEN}-after
  labels: {app: ${TOKEN}-confirmations, app.kubernetes.io/part-of: ticketing-demo, app.kubernetes.io/component: confirmations, demo.otterworks.app/run-token: "${TOKEN}", demo.otterworks.app/side: after}
spec:
  type: ExternalName
  externalName: kourier-internal.kourier-system.svc.cluster.local
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${TOKEN}-confirmations
  namespace: ${TOKEN}-after
  labels: {app: ${TOKEN}-confirmations, app.kubernetes.io/part-of: ticketing-demo, app.kubernetes.io/component: confirmations, demo.otterworks.app/run-token: "${TOKEN}", demo.otterworks.app/side: after}
  annotations:
    nginx.ingress.kubernetes.io/upstream-vhost: ${TOKEN}-confirmations.${TOKEN}-after.svc.cluster.local
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls: [{hosts: ["${TOKEN}-after.demo.otterworks.app"], secretName: ${TOKEN}-after-tls}]
  rules:
    - host: ${TOKEN}-after.demo.otterworks.app
      http:
        paths:
          - path: /api/confirmations
            pathType: Prefix
            backend: {service: {name: ${TOKEN}-confirmations-kourier, port: {number: 80}}}
