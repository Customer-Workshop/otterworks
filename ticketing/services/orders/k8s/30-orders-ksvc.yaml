# Request path: Knative Service, scale 0..6 on requests per second.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${TOKEN}-orders
  namespace: ${TOKEN}-after
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/service: orders
    app.kubernetes.io/part-of: ticketing
    app.kubernetes.io/name: orders
spec:
  template:
    metadata:
      labels:
        demo.otterworks.app/run-token: ${TOKEN}
        demo.otterworks.app/side: after
        demo.otterworks.app/service: orders
        app.kubernetes.io/part-of: ticketing
        app.kubernetes.io/name: orders
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: rps
        autoscaling.knative.dev/target: "20"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "6"
        autoscaling.knative.dev/window: "60s"
    spec:
      containerConcurrency: 0
      timeoutSeconds: 30
      containers:
        - name: orders
          image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: TOKEN
              value: ${TOKEN}
            - name: DB_URL
              value: jdbc:postgresql://${TOKEN}-orders-db.${TOKEN}-after.svc:5432/orders
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${TOKEN}-orders-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${TOKEN}-orders-db
                  key: POSTGRES_PASSWORD
            - name: DB_POOL_SIZE
              value: "8"
            - name: SEATS_BASE_URL
              value: http://${TOKEN}-seats.${TOKEN}-after.svc.cluster.local
            - name: KAFKA_BOOTSTRAP
              value: ${TOKEN}-kafka-kafka-bootstrap.${TOKEN}-after.svc:9092
            - name: ORDERS_RELAY_ENABLED
              value: "false"
            - name: ORDERS_CHANNEL
              value: API
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
