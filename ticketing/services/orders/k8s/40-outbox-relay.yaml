# Outbox relay: the same image with ORDERS_RELAY_ENABLED=true, scaled 0..1 by KEDA on unpublished outbox rows,
# so order-placed keeps flowing while the Knative request path is at zero. One replica keeps strict id order.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${TOKEN}-orders-outbox-relay
  namespace: ${TOKEN}-after
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/service: orders
    app.kubernetes.io/part-of: ticketing
    app.kubernetes.io/name: orders-outbox-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-outbox-relay
      demo.otterworks.app/run-token: ${TOKEN}
  template:
    metadata:
      labels:
        demo.otterworks.app/run-token: ${TOKEN}
        demo.otterworks.app/side: after
        demo.otterworks.app/service: orders
        app.kubernetes.io/part-of: ticketing
        app.kubernetes.io/name: orders-outbox-relay
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: relay
          image: ${IMAGE}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TOKEN
              value: ${TOKEN}
            - name: DB_URL
              value: jdbc:postgresql://${TOKEN}-orders-db.${TOKEN}-after.svc:5432/orders
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${TOKEN}-orders-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${TOKEN}-orders-db
                  key: POSTGRES_PASSWORD
            - name: DB_POOL_SIZE
              value: "3"
            - name: KAFKA_BOOTSTRAP
              value: ${TOKEN}-kafka-kafka-bootstrap.${TOKEN}-after.svc:9092
            - name: SEATS_BASE_URL
              value: http://${TOKEN}-seats.${TOKEN}-after.svc.cluster.local
            - name: ORDERS_RELAY_ENABLED
              value: "true"
            - name: ORDERS_RELAY_POLL_INTERVAL
              value: 500ms
            - name: ORDERS_RELAY_BATCH_SIZE
              value: "200"
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ${TOKEN}-orders-outbox-relay
  namespace: ${TOKEN}-after
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/service: orders
    app.kubernetes.io/part-of: ticketing
    app.kubernetes.io/name: orders-outbox-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-outbox-relay
    demo.otterworks.app/run-token: ${TOKEN}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ${TOKEN}-orders-db-trigger-auth
  namespace: ${TOKEN}-after
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/service: orders
    app.kubernetes.io/part-of: ticketing
spec:
  secretTargetRef:
    - parameter: password
      name: ${TOKEN}-orders-db
      key: POSTGRES_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${TOKEN}-orders-outbox-relay
  namespace: ${TOKEN}-after
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/service: orders
    app.kubernetes.io/part-of: ticketing
    app.kubernetes.io/name: orders-outbox-relay
spec:
  scaleTargetRef:
    name: ${TOKEN}-orders-outbox-relay
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: postgresql
      metadata:
        host: ${TOKEN}-orders-db.${TOKEN}-after.svc
        port: "5432"
        userName: orders
        dbName: orders
        sslmode: disable
        query: "SELECT count(*) FROM outbox WHERE published_at IS NULL"
        targetQueryValue: "500"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: ${TOKEN}-orders-db-trigger-auth
