# Ingress to every orders pod (Knative revisions, relay, database) from the namespace itself and the
# platform namespaces; egress is unrestricted (seats, Kafka, DB are all in-namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${TOKEN}-orders
  namespace: ${TOKEN}-after
  labels:
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/service: orders
    app.kubernetes.io/part-of: ticketing
spec:
  podSelector:
    matchLabels:
      demo.otterworks.app/service: orders
      demo.otterworks.app/run-token: ${TOKEN}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kourier-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative-serving
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
