server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payments
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${TOKEN:tkt01}-payments
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.boxoffice.payments.events.OrderPlaced
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.boxoffice.payments.events
        max.poll.interval.ms: 300000
        max.poll.records: 50
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    listener:
      ack-mode: manual_immediate
      concurrency: ${KAFKA_CONCURRENCY:1}
      # false in the inbox-relay Deployment: same image, drains outcome_deliveries only
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

payments:
  token: ${TOKEN:tkt01}
  topics:
    order-placed: ${TOKEN:tkt01}-order-placed
    payment-captured: ${TOKEN:tkt01}-payment-captured
    payment-failed: ${TOKEN:tkt01}-payment-failed
  inbox:
    confirmations-url: ${CONFIRMATIONS_URL:}
    orders-url: ${ORDERS_URL:}
    seats-url: ${SEATS_URL:}
  gateway:
    timeout-ms: ${PAYMENT_TIMEOUT_MS:4000}
    min-ms: ${GATEWAY_MIN_MS:40}
    max-ms: ${GATEWAY_MAX_MS:120}
    decline-pct: ${GATEWAY_DECLINE_PCT:0}
  relay:
    poll-ms: ${RELAY_POLL_MS:250}
    batch-size: ${RELAY_BATCH_SIZE:20}
    lease-ms: ${RELAY_LEASE_MS:120000}
    backoff-ms: ${RELAY_BACKOFF_MS:1000}
    max-backoff-ms: ${RELAY_MAX_BACKOFF_MS:30000}
    max-attempts: ${RELAY_MAX_ATTEMPTS:40}
    threads: ${RELAY_THREADS:4}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: payments
      run_token: ${TOKEN:tkt01}

logging:
  level:
    org.apache.kafka: WARN
