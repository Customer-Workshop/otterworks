spring:
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      properties:
        auto.offset.reset: earliest
payments:
  token: tkt01
  gateway:
    timeout-ms: 4000
    min-ms: 69
    max-ms: 69
    decline-pct: 0
  relay:
    poll-ms: 100
    batch-size: 20
    lease-ms: 5000
    backoff-ms: 200
    max-backoff-ms: 400
    max-attempts: 40
    threads: 2
logging:
  level:
    root: WARN
    com.boxoffice: INFO
