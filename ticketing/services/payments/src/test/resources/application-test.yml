spring:
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      properties:
        auto.offset.reset: earliest
payments:
  token: tkt01
  gateway:
    timeout-ms: 4000
    min-ms: 69
    max-ms: 69
    decline-pct: 0
logging:
  level:
    root: WARN
    com.boxoffice: INFO
