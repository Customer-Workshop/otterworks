apiVersion: v1
kind: Secret
metadata:
  name: ${TOKEN}-seats-db
  labels:
    app.kubernetes.io/name: seats-db
    app.kubernetes.io/part-of: ticketing
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
type: Opaque
stringData:
  POSTGRES_DB: seats
  POSTGRES_USER: seats
  POSTGRES_PASSWORD: seats-demo-synthetic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${TOKEN}-seats-db
  labels:
    app.kubernetes.io/name: seats-db
    app.kubernetes.io/part-of: ticketing
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: seats-db, demo.otterworks.app/run-token: ${TOKEN}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seats-db
        app.kubernetes.io/part-of: ticketing
        demo.otterworks.app/run-token: ${TOKEN}
        demo.otterworks.app/side: after
    spec:
      containers:
        - name: postgres
          image: 599083837640.dkr.ecr.us-east-1.amazonaws.com/otterworks-demo/ticketing/postgres:16-alpine
          envFrom: [{secretRef: {name: ${TOKEN}-seats-db}}]
          args: ["-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off"]
          ports: [{containerPort: 5432, name: pg}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "seats", "-d", "seats"]}, periodSeconds: 5}
          livenessProbe: {exec: {command: ["pg_isready", "-U", "seats", "-d", "seats"]}, periodSeconds: 20, failureThreshold: 6}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${TOKEN}-seats-db
  labels:
    app.kubernetes.io/name: seats-db
    app.kubernetes.io/part-of: ticketing
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: seats-db, demo.otterworks.app/run-token: ${TOKEN}}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
