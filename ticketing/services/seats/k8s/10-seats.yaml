apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${TOKEN}-seats
  labels:
    app.kubernetes.io/name: seats
    app.kubernetes.io/part-of: ticketing
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seats
        app.kubernetes.io/part-of: ticketing
        demo.otterworks.app/run-token: ${TOKEN}
        demo.otterworks.app/side: after
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: rps
        autoscaling.knative.dev/target: "40"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "6"
        autoscaling.knative.dev/scale-down-delay: "30s"
        autoscaling.knative.dev/window: "60s"
    spec:
      containerConcurrency: 0
      timeoutSeconds: 60
      containers:
        - name: seats
          image: ${IMAGE}
          ports: [{containerPort: 8080, name: http1}]
          env:
            - {name: TOKEN, value: "${TOKEN}"}
            - {name: SEATS_DB_URL, value: "jdbc:postgresql://${TOKEN}-seats-db.${TOKEN}-after.svc.cluster.local:5432/seats"}
            - {name: SEATS_DB_USER, valueFrom: {secretKeyRef: {name: ${TOKEN}-seats-db, key: POSTGRES_USER}}}
            - {name: SEATS_DB_PASSWORD, valueFrom: {secretKeyRef: {name: ${TOKEN}-seats-db, key: POSTGRES_PASSWORD}}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "${TOKEN}-kafka-kafka-bootstrap.${TOKEN}-after.svc:9092"}
            - {name: KAFKA_ENABLED, value: "true"}
            - {name: ORDERS_BASE_URL, value: "http://${TOKEN}-orders.${TOKEN}-after.svc.cluster.local"}
            - {name: ORDERS_INBOX_ENABLED, value: "true"}
            - {name: HOLD_MINUTES, value: "10"}
            - {name: SWEEP_BATCH_SIZE, value: "500"}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dspring.main.lazy-initialization=false"}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 20, failureThreshold: 3}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 768Mi}
---
# Plain ClusterIP Service on the revision pods (user container port) so a ServiceMonitor can scrape
# /actuator/prometheus without going through the Knative queue-proxy.
apiVersion: v1
kind: Service
metadata:
  name: ${TOKEN}-seats-metrics
  labels:
    app.kubernetes.io/name: seats
    app.kubernetes.io/part-of: ticketing
    demo.otterworks.app/run-token: ${TOKEN}
    demo.otterworks.app/side: after
    demo.otterworks.app/metrics: seats
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    serving.knative.dev/service: ${TOKEN}-seats
  ports: [{name: http-metrics, port: 8080, targetPort: 8080}]
