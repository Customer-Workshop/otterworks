server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: seats
  datasource:
    url: ${SEATS_DB_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${SEATS_DB_USER:seats}
    password: ${SEATS_DB_PASSWORD:seats}
    hikari:
      maximum-pool-size: ${SEATS_DB_POOL:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
        enable.idempotence: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

seats:
  # Same knob and default as the monolith (Config.holdMinutes)
  hold-minutes: ${HOLD_MINUTES:10}
  sweep-batch-size: ${SWEEP_BATCH_SIZE:500}
  token: ${TOKEN:tkt01}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic-hold-expired: ${TOPIC_HOLD_EXPIRED:${TOKEN:tkt01}-hold-expired}
  orders:
    enabled: ${ORDERS_INBOX_ENABLED:true}
    base-url: ${ORDERS_BASE_URL:http://${TOKEN:tkt01}-orders.${TOKEN:tkt01}-after.svc.cluster.local}
    timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: seats
      run_token: ${TOKEN:tkt01}

logging:
  level:
    root: INFO
    com.otterworks.ticketing.seats: INFO
